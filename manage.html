<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Web2Trilium</title>
  <link rel="stylesheet" href="manage.css" />
</head>

<body>
  <header>
    <h1>Web2Trilium</h1>
    <div class="top-actions">
      <select id="profileSelect" title="Trilium profile to save into"></select>
      <button id="refresh">Refresh</button>
      <button id="toggleSidebar">Open in Sidebar</button>
      <button id="openOptions">Settings</button>
    </div>
  </header>

  <input type="text" id="search" placeholder="Filter bookmarks by title or URL…" />

  <div id="banner"></div>

  <div id="selectionBar">
    <span id="selectionCount"></span>
    <div class="sel-actions">
      <button id="selSave" class="save-btn">Save to Inbox</button>
      <button id="selDelete" class="delete-btn">Delete</button>
      <button id="selClear">Clear</button>
    </div>
  </div>

  <h2 class="section-title" id="tabsSection">Open Tabs</h2>
  <div id="tabsTree" role="listbox" aria-multiselectable="true" aria-label="Open tabs"></div>

  <h2 class="section-title" id="bookmarksSection">Bookmarks</h2>
  <div id="tree" role="listbox" aria-multiselectable="true" aria-label="Bookmarks"></div>

  <script src="trilium-api.js"></script>
  <script src="profiles.js"></script>
  <script src="manage.js"></script>
</body>

</html>
